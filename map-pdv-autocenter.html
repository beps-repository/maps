<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mappa negozi Bep's</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js"></script>

    <style>
        html, body { margin: 0; height: 100%; }

        #map {
            width: 100%;
            height: 100%;
        }
        .custom-cluster {
            background: #e10b17;
            color: white;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .custom-marker img {
            width: 40px;
            height: 40px;
        }
        .leaflet-attribution-flag {
            display: none !important;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            border-radius: 0 !important;
        }
        .scopri-di-piu-btn {
            display: inline-block;
            background-color: #e10b17;
            color: white !important;
            padding: 2px 6px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        .scopri-di-piu-btn:hover {
            background-color: #c00d15;
        }
        .leaflet-overlay-pane path {
            display: none !important;
        }
        /* Marker posizione utente: pin con solo contorno bianco sottile, senza riempimento,
           cosi' il logo Bep's del punto vendita sotto resta visibile.
           Il drop-shadow scuro serve a far leggere il bianco sulla mappa chiara.
           Si usa un divIcon con SVG inline e non un circleMarker perche' le regole sopra
           nascondono tutti i path vettoriali di Leaflet (solo nell'overlay-pane: l'SVG
           dentro il marker-pane non e' toccato). */
        .user-location-pin {
            width: 24px;
            height: 32px;
            filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 1px rgba(0, 0, 0, 0.5));
        }
        .user-location-pin svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <script>
        const allowedDomains = ["www.beps.it", "sviluppo.beps.it", "www.axo.com", "sites.google.com", "new.beps.it", "local.beps.it", "prod.beps.it", "prod.axo.com"];

        const accessAllowed = allowedDomains.some(domain => document.referrer.includes(domain));
        if (!accessAllowed) {
            document.body.innerHTML = "<h1>Accesso Negato</h1>";
        }
    </script>

    <script>
        // Versione 29-10-26 - centraggio mappa da parte del sito (parametri URL + postMessage)
        //                     + filtro dei marker per codice negozio (messaggio filterMarkers)
        //                     + su mobile la mappa si muove con due dita (gesture handling),
        //                       con un dito scorre la pagina
        //                     + posizione utente come pin bianco outline (non copre il logo del negozio)
        //                     + 29-10: accetta anche il tipo "filter-markers" (nome usato dal sito)
        //                     + 29-10: alias per i Codice Store di Amasty diversi dal foglio (BO, TO)
        if (accessAllowed) {

        const PROXY_URL = "https://europe-west1-server-tile-beps.cloudfunctions.net/proxyMapTilerCsv";

        // Origin (schema + dominio) da cui accettiamo i messaggi dal sito.
        // Per i test su new.beps.it basta che ci sia in questa lista.
        const ALLOWED_ORIGINS = [
            "https://www.beps.it",
            "https://new.beps.it",
            "https://prod.beps.it",
            "https://sviluppo.beps.it",
            "https://local.beps.it",
            "https://www.axo.com",
            "https://prod.axo.com"
        ];

        // Origin del sito che ospita l'iframe: serve come destinatario dei messaggi
        // che mandiamo noi (GA4, mapReady). Prima era fisso su www.beps.it, quindi
        // su new.beps.it gli eventi GA4 venivano scartati dal browser.
        function getParentOrigin() {
            try {
                const refOrigin = new URL(document.referrer).origin;
                if (ALLOWED_ORIGINS.includes(refOrigin)) return refOrigin;
            } catch (e) { /* referrer assente o non valido */ }
            return "https://www.beps.it";
        }
        const PARENT_ORIGIN = getParentOrigin();

        const DEFAULT_CENTER = [45.5, 10.5];
        const DEFAULT_ZOOM = 6.8;
        const DEFAULT_USER_ZOOM = 11;

        // Gesture handling: true = attivo anche su desktop (Ctrl + scroll per zoomare),
        // L.Browser.mobile = attivo solo su mobile, il desktop resta invariato.
        const GESTURE_HANDLING = L.Browser.mobile;

        // Intestazione della colonna del CSV con il codice negozio (stesso valore del
        // "Codice Store" dell'attributo location in Amasty: TV1, PD, VR2...).
        // Si cerca per NOME dell'intestazione, non per indice, cosi' non si rompe se
        // qualcuno sposta le colonne del foglio. Confronto esatto: "cod. negozio_bis"
        // e "cod. negozio ga4" sono colonne diverse e non vanno confuse con questa.
        const CODE_COLUMN_HEADER = "cod. negozio";

        // Alias: Codice Store usato in Amasty (sito) -> "cod. negozio" del foglio.
        // Il sito manda "BO" e "TO", il foglio ha "BO1" e "TO1". Va tolto quando
        // il programmatore allinea i codici in Amasty (BO -> BO1, TO -> TO1).
        const CODE_ALIASES = { "BO": "BO1", "TO": "TO1" };

        function validCoords(lat, lon) {
            return typeof lat === "number" && typeof lon === "number" &&
                   isFinite(lat) && isFinite(lon) &&
                   lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180;
        }

        function cleanZoom(zoom) {
            const z = parseFloat(zoom);
            if (!isFinite(z)) return DEFAULT_USER_ZOOM;
            return Math.min(18, Math.max(3, z));
        }

        // Codici confrontati come stringhe, senza spazi e in maiuscolo: "tv1 " == "TV1".
        function normalizeCode(value) {
            return String(value == null ? "" : value).trim().toUpperCase();
        }

        // Codici ricevuti dal sito: normalizzati e poi passati dalla tabella degli alias.
        function normalizeIncomingCode(value) {
            const code = normalizeCode(value);
            return CODE_ALIASES[code] || code;
        }

        // Stato: se il sito ha gia' indicato una posizione utente, il fitBounds
        // finale del caricamento marker NON deve sovrascriverla.
        let userLocated = false;
        let userMarker = null;

        // Stato del filtro marker.
        //   activeFilter = null  -> tutti i negozi visibili
        //   activeFilter = Set   -> solo i negozi con questi codici (Set vuoto = nessuno)
        // Lo stato vale anche se il messaggio arriva prima che il CSV sia caricato:
        // viene applicato appena i marker esistono.
        let activeFilter = null;
        let codeColumnFound = true;   // se false (colonna assente) il filtro viene ignorato
        let dataLoaded = false;
        let pendingAck = null;        // destinatario della conferma, se il filtro e' arrivato prima del CSV
        let clusterGroup = null;
        let markerEntries = [];       // [{ store, marker }]

        // --- Posizione iniziale da parametri URL (?lat=..&lon=..&zoom=..) ---
        const urlParams = new URLSearchParams(window.location.search);
        const initLat = parseFloat(urlParams.get("lat"));
        const initLon = parseFloat(urlParams.get("lon"));
        const hasInitial = validCoords(initLat, initLon);

        async function fetchStoreData() {
            try {
                const response = await fetch(`${PROXY_URL}?type=csv`);
                if (!response.ok) {
                    throw new Error(`Errore HTTP: ${response.status}`);
                }
                const csvText = await response.text();

                function parseCSV(csvText) {
                    const rows = [];
                    const lines = csvText.split("\n");
                    lines.forEach((line) => {
                        const regex = /(?:,|^)(?:"([^"]*)"|([^",]*))/g;
                        const row = [];
                        let match;
                        while ((match = regex.exec(line)) !== null) {
                            row.push(match[1] || match[2]);
                        }
                        rows.push(row);
                    });
                    return rows;
                }

                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    console.error("Errore: Il CSV ricevuto non contiene dati.");
                    return [];
                }

                // Colonna del codice negozio, cercata per intestazione.
                const header = rows[0].map(h => String(h || "").trim().toLowerCase());
                const codeIdx = header.indexOf(CODE_COLUMN_HEADER);
                codeColumnFound = codeIdx !== -1;
                if (!codeColumnFound) {
                    console.error(`Colonna "${CODE_COLUMN_HEADER}" non trovata nel CSV: il filtro filterMarkers viene ignorato.`);
                }

                return rows.slice(1).map(cols => ({
                    name: cols[5]?.trim() || "Sconosciuto",
                    lat: parseFloat(cols[38]?.trim()),
                    lng: parseFloat(cols[39]?.trim()),
                    link: cols[41]?.trim() || "#",
                    include: cols[40]?.trim() === "1",
                    region: cols[42]?.trim() || "Sconosciuto",
                    code: codeColumnFound ? normalizeCode(cols[codeIdx]) : ""
                })).filter(store => store.include && !isNaN(store.lat) && !isNaN(store.lng));
            } catch (error) {
                console.error("Errore nel caricamento dei dati:", error);
                return [];
            }
        }

        const map = L.map('map', {
            gestureHandling: GESTURE_HANDLING,
            gestureHandlingOptions: {
                duration: 1500,
                text: {
                    touch: "Usa due dita per spostare la mappa",
                    scroll: "Usa Ctrl + scroll per zoomare la mappa",
                    scrollMac: "Usa ⌘ + scroll per zoomare la mappa"
                }
            }
        }).setView(
            hasInitial ? [initLat, initLon] : DEFAULT_CENTER,
            hasInitial ? cleanZoom(urlParams.get("zoom")) : DEFAULT_ZOOM
        );
        L.tileLayer('https://maps.triosrl.com/styles/basic-preview/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function placeUserMarker(lat, lon) {
            if (userMarker) {
                userMarker.setLatLng([lat, lon]);
            } else {
                userMarker = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: "",
                        html: "<div class='user-location-pin'>" +
                              "<svg viewBox='0 0 24 32' xmlns='http://www.w3.org/2000/svg'>" +
                              "<path d='M12 31C12 31 2 19.5 2 12a10 10 0 0 1 20 0c0 7.5-10 19-10 19z' " +
                              "fill='none' stroke='#ffffff' stroke-width='1.5' stroke-linejoin='round'/>" +
                              "<circle cx='12' cy='12' r='3.5' fill='none' stroke='#ffffff' stroke-width='1.5'/>" +
                              "</svg></div>",
                        iconSize: [24, 32],
                        iconAnchor: [12, 31]   // la punta del pin sta sulla posizione esatta
                    }),
                    interactive: false,
                    keyboard: false,
                    zIndexOffset: 1000
                }).addTo(map);
            }
        }

        if (hasInitial) {
            userLocated = true;
            placeUserMarker(initLat, initLon);
        }

        // --- Filtro marker ---
        function visibleEntries() {
            if (!activeFilter || !codeColumnFound) return markerEntries;
            return markerEntries.filter(e => activeFilter.has(e.store.code));
        }

        // Ricostruisce il gruppo dei cluster con i soli marker visibili.
        // Non si tolgono i singoli marker dalla mappa: con markercluster si lavora sul gruppo.
        function applyMarkerFilter() {
            if (!clusterGroup) return 0;
            map.closePopup();
            clusterGroup.clearLayers();
            const visible = visibleEntries();
            clusterGroup.addLayers(visible.map(e => e.marker));
            return visible.length;
        }

        // Inquadra i negozi visibili (tutti, o solo quelli del filtro).
        // Con un solo negozio lo zoom e' limitato a 12, come in mappa-negozio.html.
        // Se il filtro non lascia nessun negozio la vista non si muove.
        function fitVisibleStores() {
            const stores = visibleEntries().map(e => e.store);
            if (stores.length > 0) {
                const group = L.featureGroup(stores.map(s => L.marker([s.lat, s.lng])));
                map.fitBounds(group.getBounds(), { padding: [30, 30], maxZoom: 12 });
            } else if (!activeFilter) {
                map.setView([45.4642, 9.1900], 6);
            }
        }

        // Codici ricevuti dal sito che non esistono nel CSV: aiuta a scoprire
        // un disallineamento tra i Codice Store di Magento e la colonna del foglio.
        function warnUnknownCodes() {
            if (!activeFilter || !codeColumnFound) return;
            const known = new Set(markerEntries.map(e => e.store.code));
            const unknown = [...activeFilter].filter(c => !known.has(c));
            if (unknown.length > 0) {
                console.warn("filterMarkers: codici non presenti nel CSV (ignorati):", unknown.join(", "));
            }
        }

        function sendFilterAck(reply, count) {
            if (!reply || !reply.source) return;
            try {
                reply.source.postMessage(
                    { type: "markersFiltered", count: count, total: markerEntries.length },
                    reply.origin
                );
            } catch (e) { /* finestra chiusa o non raggiungibile */ }
        }

        // --- Messaggi dal sito (postMessage) ---
        // Formati accettati:
        //   { type: "setUserLocation", lat: 45.67, lon: 12.24, zoom: 11 }  -> centra la mappa sull'utente
        //   { type: "clearUserLocation" }                                   -> torna alla vista con tutti i negozi
        //   { type: "filterMarkers", codes: ["TV1", "PD"] }                 -> mostra solo questi negozi
        //   { type: "filterMarkers", codes: null }                          -> mostra tutti i negozi
        //   (opzionale) fit: false                                          -> filtra senza spostare la mappa
        //   "filter-markers" e' accettato come sinonimo di "filterMarkers".
        // Risposta all'invio di filterMarkers:
        //   { type: "markersFiltered", count: <marker visibili>, total: <marker totali> }
        window.addEventListener("message", (event) => {
            if (!ALLOWED_ORIGINS.includes(event.origin)) return;

            const data = event.data;
            if (!data || typeof data !== "object") return;

            if (data.type === "setUserLocation") {
                const lat = parseFloat(data.lat);
                const lon = parseFloat(data.lon);
                if (!validCoords(lat, lon)) {
                    console.warn("setUserLocation ignorato: coordinate non valide", data);
                    return;
                }
                userLocated = true;
                placeUserMarker(lat, lon);
                map.flyTo([lat, lon], cleanZoom(data.zoom), { duration: 1 });
            }

            if (data.type === "clearUserLocation") {
                userLocated = false;
                if (userMarker) {
                    map.removeLayer(userMarker);
                    userMarker = null;
                }
                fitVisibleStores();
            }

            if (data.type === "filterMarkers" || data.type === "filter-markers") {
                if (data.codes === null) {
                    activeFilter = null;
                } else if (Array.isArray(data.codes)) {
                    activeFilter = new Set(data.codes.map(normalizeIncomingCode).filter(Boolean));
                } else {
                    console.warn("filterMarkers ignorato: 'codes' deve essere un array o null", data);
                    return;
                }

                const reply = { source: event.source, origin: event.origin };
                if (!dataLoaded) {
                    // I marker non esistono ancora: il filtro e' gia' salvato,
                    // verra' applicato (e confermato) a fine caricamento.
                    pendingAck = reply;
                    return;
                }

                const count = applyMarkerFilter();
                warnUnknownCodes();
                // Se l'utente e' stato localizzato non spostiamo la mappa.
                if (data.fit !== false && !userLocated) {
                    fitVisibleStores();
                }
                sendFilterAck(reply, count);
            }
        });

        // Funzione per tracciare eventi GA4
        function trackGA4Click(store, region) {
            console.log(`Tracciamento GA4: ${store} - ${region}`);

            const eventData = {
                event: "store_locator",
                category: "store_select",
                action: region,
                label: store
            };

            console.log("Evento inviato a Magento:", eventData);
            window.parent.postMessage(eventData, PARENT_ORIGIN);
        }

        async function loadMarkers() {
            const stores = await fetchStoreData();
            clusterGroup = L.markerClusterGroup({
                iconCreateFunction: cluster => L.divIcon({
                    html: `<div class='custom-cluster'>${cluster.getChildCount()}</div>`,
                    className: 'custom-cluster',
                    iconSize: [45, 45]
                })
            });

            markerEntries = stores.map(store => {
                const customIcon = L.icon({
                    iconUrl: "https://www.beps.it/pub/media/beps/Logo_48x48.png",
                    iconSize: [40, 40]
                });

                const marker = L.marker([store.lat, store.lng], { icon: customIcon })
                    .bindPopup(`
                        <b>${store.name}</b><br>
                        Regione: ${store.region}<br>
                        <a href="${store.link}" target="_blank" class="scopri-di-piu-btn">Scopri di più</a>
                    `)
                    .on('click', () => trackGA4Click(store.name, store.region));

                return { store, marker };
            });

            // Se un filtro e' arrivato prima del CSV viene applicato qui.
            clusterGroup.addLayers(visibleEntries().map(e => e.marker));
            map.addLayer(clusterGroup);
            dataLoaded = true;

            // Se il sito ha gia' centrato la mappa sull'utente (URL o postMessage),
            // non la riportiamo sulla vista "tutta Italia".
            if (!userLocated) {
                fitVisibleStores();
            }

            if (pendingAck) {
                warnUnknownCodes();
                sendFilterAck(pendingAck, visibleEntries().length);
                pendingAck = null;
            }
        }

        loadMarkers();

        // Segnala al sito che la mappa e' pronta a ricevere messaggi
        // (il listener e' gia' registrato a questo punto).
        window.parent.postMessage({ type: "mapReady" }, PARENT_ORIGIN);

        } // fine if (accessAllowed)
    </script>

</body>
</html>
