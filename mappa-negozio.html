<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Punti Vendita Selezionati</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body { margin: 0; }
        #map-wrapper { position: relative; width: 100%; height: 500px; }
        #map { width: 100%; height: 100%; }
        .leaflet-popup-content-wrapper { border-radius: 0px !important; }
        .leaflet-attribution-flag { display: none !important; }

        /* Punti vendita non selezionati: stesso logo, in grigio e leggermente trasparente */
        .marker-grey { filter: grayscale(1) opacity(0.6); }

        /* Avviso "clicca per usare lo zoom" */
        #map-hint {
            position: absolute;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font: 14px sans-serif;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        #map-hint.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="map-wrapper">
        <div id="map"></div>
        <div id="map-hint">Clicca sulla mappa per usare lo zoom con la rotellina</div>
    </div>

    <script>
        const allowedDomains = ["www.beps.it", "sviluppo.beps.it", "www.axo.com", "sites.google.com", "new.beps.it", "local.beps.it"];

        if (!allowedDomains.some(domain => document.referrer.includes(domain))) {
            document.body.innerHTML = "<h1>Accesso Negato</h1>";
        }
    </script>

    <script>
        const PROXY_URL = "https://europe-west1-server-tile-beps.cloudfunctions.net/proxyMapTilerCsv";
        const TILESERVER_URL = "https://maps.triosrl.com/styles/basic-preview/{z}/{x}/{y}.png";

        function getStoreIdsFromURL() {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get("store_ids") || params.get("store_id");
            if (!raw) return [];
            return raw.split(",").map(id => id.trim());
        }

        function parseCSV(csvText) {
            const rows = [];
            const lines = csvText.split("\n");
            lines.forEach(line => {
                const regex = /(?:,|^)(?:"([^"]*)"|([^",]*))/g;
                const row = [];
                let match;
                while ((match = regex.exec(line)) !== null) {
                    row.push(match[1] || match[2]);
                }
                rows.push(row);
            });
            return rows;
        }

        // Restituisce i punti vendita selezionati e tutti gli altri (con coordinate valide)
        async function fetchStores(storeIds) {
            const response = await fetch(`${PROXY_URL}?type=csv`);
            const csvText = await response.text();
            const rows = parseCSV(csvText);

            const header = rows[0];
            const codAmastyIndex = header.indexOf("cod. amasty");
            const latIndex = 38;
            const lngIndex = 39;
            const nameIndex = 5;

            const all = rows
                .slice(1)
                .map(row => ({
                    id: (row[codAmastyIndex] || "").trim(),
                    lat: parseFloat(row[latIndex]),
                    lng: parseFloat(row[lngIndex]),
                    name: row[nameIndex] || "Punto Vendita"
                }))
                .filter(store => store.id && !isNaN(store.lat) && !isNaN(store.lng));

            return {
                selected: all.filter(store => storeIds.includes(store.id)),
                others: all.filter(store => !storeIds.includes(store.id))
            };
        }

        async function initMap() {
            const storeIds = getStoreIdsFromURL();
            if (storeIds.length === 0) {
                console.error("Nessun store_id o store_ids specificato.");
                return;
            }

            const { selected: stores, others } = await fetchStores(storeIds);
            if (stores.length === 0) {
                console.error("Nessun punto vendita trovato.");
                return;
            }

            // Mappa: lo zoom con la rotellina parte disattivato,
            // così non interferisce con lo scroll della pagina che contiene l'iframe
            const map = L.map("map", {
                scrollWheelZoom: false
            });

            // Zoom con la rotellina attivo solo dopo un click sulla mappa
            map.on("click", () => map.scrollWheelZoom.enable());

            // Quando il mouse esce dalla mappa, la rotellina torna a scrollare la pagina
            map.on("mouseout", () => map.scrollWheelZoom.disable());

            // Avviso temporaneo se l'utente prova a usare la rotellina senza aver cliccato
            const hint = document.getElementById("map-hint");
            let hintTimer;
            map.getContainer().addEventListener("wheel", () => {
                if (!map.scrollWheelZoom.enabled()) {
                    hint.classList.add("show");
                    clearTimeout(hintTimer);
                    hintTimer = setTimeout(() => hint.classList.remove("show"), 1200);
                }
            }, { passive: true });

            L.tileLayer(TILESERVER_URL, {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const iconOptions = {
                iconUrl: "https://www.beps.it/pub/media/beps/Logo_48x48.png",
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -40]
            };

            // Icona colorata per i punti vendita selezionati
            const selectedIcon = L.icon(iconOptions);

            // Icona grigia (stesso logo, desaturato via CSS) per gli altri punti vendita
            const greyIcon = L.icon({ ...iconOptions, className: "marker-grey" });

            // Prima gli altri punti vendita, sotto a quelli selezionati
            others.forEach(store => {
                L.marker([store.lat, store.lng], { icon: greyIcon, zIndexOffset: -1000 })
                    .addTo(map)
                    .bindPopup(`<b>${store.name}</b>`);
            });

            // Poi quelli selezionati, sempre in primo piano
            const bounds = [];

            stores.forEach(store => {
                L.marker([store.lat, store.lng], { icon: selectedIcon, zIndexOffset: 1000 })
                    .addTo(map)
                    .bindPopup(`<b>${store.name}</b>`);

                bounds.push([store.lat, store.lng]);
            });

            if (stores.length === 1) {
                // Zoom fisso se un solo punto
                map.setView([stores[0].lat, stores[0].lng], 12);
            } else {
                // Fit bounds per più punti
                map.fitBounds(bounds, { padding: [30, 30] });
            }
        }

        initMap();
    </script>
</body>
</html>
